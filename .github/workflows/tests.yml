name: Tests

on:
  workflow_call:
    inputs:
      slice_count:
        description: Number of parallel test slices
        type: number
        default: 8

permissions:
  contents: read

# Cancel in-progress runs for the same ref
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: "Generate slices"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      slice-plan-digest: ${{ steps.matrix.outputs.slice-plan-digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Slice composition is a pure function of the committed tree: LPT over
      # ci/test_durations.json, which is checked in. No cache is restored here
      # on purpose. Two runs of the same commit therefore produce byte-identical
      # slices, and a red slice reproduces locally with
      #   scripts/run_tests.sh --slice <i>/8
      #
      # (The previous version restored an `actions/cache` entry keyed
      # `test-durations` while the save step wrote `test-durations-<run_id>`.
      # Those keys never matched and cache entries are immutable, so every run
      # silently planned against one frozen blob from 2026-06-11 that no one
      # could see or reproduce — and would have reshuffled every slice at once
      # the moment it was evicted.)
      - name: Generate test slices
        id: matrix
        run: |
          set -euo pipefail
          # stdout is the matrix; the plan digest and summary go to stderr.
          MATRIX=$(python3 scripts/run_tests_parallel.py \
            --generate-slices ${{ inputs.slice_count }} 2> plan.log)
          cat plan.log
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          # One digest, computed in one place. Compare it across runs to
          # confirm determinism; it also matches what a laptop prints.
          DIGEST=$(grep -oP 'slice plan digest: \K\S+' plan.log)
          echo "slice-plan-digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Slice plan"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Deterministic: same commit => same digest => same slices."
            echo "Reproduce a slice locally: \`scripts/run_tests.sh --slice <i>/${{ inputs.slice_count }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Run tests slice ${{ matrix.slice.index }}/${{ inputs.slice_count }}
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Minimize uv cache
        # Optimized for CI: prunes pre-built wheels that are cheap to
        # re-download, keeping the persisted cache small and fast to restore.
        run: uv cache prune --ci

      - name: Run tests (slice ${{ matrix.slice.index }}/${{ inputs.slice_count }})
        # Per-file isolation via scripts/run_tests.sh: each test file runs
        # in its own freshly-spawned `python -m pytest <file>` subprocess
        # with bounded parallelism. No xdist, no shared workers, no
        # module-level state leakage between files.
        #
        # File list is pre-computed by the generate job (--generate-slices)
        # which runs LPT distribution once and passes the file list to each
        # matrix job via --files. Previously each job re-discovered files and
        # re-ran LPT independently — redundant N times.
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh --files '${{ matrix.slice.files }}'
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      # Measured durations, published as evidence only. Nothing in CI reads
      # these back: the slice plan comes from the committed snapshot. They
      # exist so a human can refresh that snapshot deliberately (see below).
      # Named per slice so the download step can't have one clobber another.
      - name: Upload per-slice durations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-durations-slice-${{ matrix.slice.index }}
          path: test_durations.json
          retention-days: 14

  # Publish a refreshed slice-plan snapshot as a downloadable artefact.
  #
  # This does NOT feed back into CI automatically — that is the whole point.
  # Auto-feedback is what made slice composition unreproducible: the plan
  # depended on the last run's measurements rather than on the tree.
  #
  # Refreshing the plan is a reviewed commit, not a side effect:
  #   1. download `test-durations-snapshot` from a green run on main, or from
  #      a manual run of this workflow on your branch
  #   2. cp test_durations.json ci/test_durations.json
  #   3. commit — the diff shows exactly how the plan will move
  #
  # Runs on main, and on manual dispatch from any branch: adding a batch of
  # tests is exactly when you want a fresh snapshot without waiting for a merge.
  propose-durations-snapshot:
    name: "Propose durations snapshot"
    needs: test
    if: >-
      needs.test.result == 'success'
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all slice durations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-durations-slice-*
          path: durations
          # NOT merge-multiple: every artefact contains a file called
          # test_durations.json, so flattening them into one directory makes
          # them overwrite each other and you keep exactly one slice's data.
          # Keep them in per-artefact subdirectories and merge explicitly.

      - name: Merge slices into a snapshot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, pathlib

          merged: dict[str, float] = {}
          shards = sorted(glob.glob("durations/**/test_durations.json", recursive=True))
          for f in shards:
              merged.update(json.loads(pathlib.Path(f).read_text()))

          # Keep only repo-relative paths to real test files. The runner's own
          # probe tests invoke it against files under /tmp, and those absolute
          # paths would otherwise land in the snapshot and churn every refresh.
          root = pathlib.Path(".").resolve()
          clean = {
              k: round(float(v), 3)
              for k, v in merged.items()
              if k.startswith("tests/") and (root / k).is_file()
          }
          dropped = len(merged) - len(clean)

          out = pathlib.Path("test_durations.json")
          out.write_text(json.dumps(clean, indent=2, sort_keys=True) + "\n")
          print(f"merged {len(shards)} shards -> {len(clean)} files ({dropped} dropped)")
          print(f"total measured work: {sum(clean.values()):.0f}s")

          old = json.loads(pathlib.Path("ci/test_durations.json").read_text())
          added = len(set(clean) - set(old))
          removed = len(set(old) - set(clean))
          print(f"vs committed snapshot: +{added} file(s), -{removed} file(s)")
          PY

      - name: Upload snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-durations-snapshot
          path: test_durations.json
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Minimize uv cache
        # Optimized for CI: prunes pre-built wheels that are cheap to
        # re-download, keeping the persisted cache small and fast to restore.
        run: uv cache prune --ci

      - name: Packaged-wheel i18n smoke test
        run: |
          source .venv/bin/activate
          python -m pytest -m integration tests/test_wheel_locales_e2e.py -v

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
