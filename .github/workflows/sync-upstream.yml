name: Sync Upstream

on:
  schedule:
    - cron: '0 11 * * *'   # daily at 11:00 UTC (04:00 PDT / 03:00 PST)
  workflow_dispatch:       # also triggerable manually

permissions:
  contents: write

# Never let two daily syncs (or a manual dispatch + the schedule) race the
# force-push to main.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0         # full history needed for rebase
          ref: main
          # SYNC_PAT = fine-grained PAT with Contents + Workflows write. Required
          # because the default GITHUB_TOKEN may NOT push changes under
          # .github/workflows/, so the sync fails whenever upstream touches a
          # workflow file. Falls back to GITHUB_TOKEN if the secret is unset
          # (sync then still fails on upstream workflow changes, as before).
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main --quiet

      - name: Check if upstream has new commits
        id: check
        run: |
          UPSTREAM_AHEAD=$(git rev-list --count origin/main..upstream/main 2>/dev/null || echo "0")
          CUSTOM_AHEAD=$(git rev-list --count upstream/main..origin/main 2>/dev/null || echo "0")
          echo "upstream_ahead=$UPSTREAM_AHEAD" >> $GITHUB_OUTPUT
          echo "custom_ahead=$CUSTOM_AHEAD" >> $GITHUB_OUTPUT
          echo "Upstream ahead by $UPSTREAM_AHEAD commits"
          echo "Fork ahead by $CUSTOM_AHEAD commits (custom)"

      - name: Rebase custom commits onto upstream
        if: steps.check.outputs.upstream_ahead != '0'
        run: |
          # Committer identity for the rebase replay. MUST be obelisk-complex's
          # real noreply id, not the old `obelisk@…` (which is an unrelated user
          # and re-stamps every custom commit's committer with the wrong author).
          git config user.email "265670482+obelisk-complex@users.noreply.github.com"
          git config user.name "obelisk-complex"
          echo "⚜️ Rebasing ${{ steps.check.outputs.custom_ahead }} custom commit(s) onto ${{ steps.check.outputs.upstream_ahead }} new upstream commit(s)..."
          if ! git rebase upstream/main; then
            git rebase --abort || true
            echo "::error::Upstream rebase hit a conflict — custom commits need a manual rebase onto upstream/main. origin/main left untouched."
            exit 1
          fi

      - name: Validate rebased tree (pre-push gate)
        if: steps.check.outputs.upstream_ahead != '0'
        run: |
          # Catch conflict markers / syntax breakage the rebase may have left in
          # the import-critical and fork-customised files.
          for f in hermes_cli/main.py hermes_cli/plugins.py agent/conversation_loop.py tools/delegate_tool.py; do
            python3 -m py_compile "$f" || { echo "::error::rebased tree: $f does not compile (conflict markers?)"; exit 1; }
          done
          # Guard tests (stdlib-only, no install needed): fail the sync if the
          # rebase relocated/dropped the custom on_output hook or the _blocked
          # reset, lost the update syntax-guard coverage, or reintroduced a
          # shadowed stdlib import. This is the real "CI tests as persistence"
          # gate — it runs BEFORE the push, so a broken rebase never reaches
          # origin/main (which every `hermes update` consumer hard-resets to).
          python3 tests/agent/test_on_output_retry_loop.py
          python3 tests/hermes_cli/test_update_safety.py
          python3 tests/agent/test_hook_contract.py
          python3 tests/tools/test_delegate_instructions.py

      - name: Push validated rebase
        # Explicit success() (already implicit) makes the gate unmistakable: the
        # force-push runs ONLY if the rebase and the pre-push validation passed.
        if: success() && steps.check.outputs.upstream_ahead != '0'
        run: |
          git push --force-with-lease origin main
          echo "✓ Fork synced — ${{ steps.check.outputs.custom_ahead }} commit(s) rebased, validated, and pushed to origin/main"

      - name: Report sync failure
        if: failure()
        run: |
          echo "::error::Daily upstream sync FAILED — origin/main was NOT updated. A rebase conflict or a pre-push validation failure blocked the sync; the customisation needs manual attention. See the failing step above."
