[pytest]
# NOTE: rootdir is the REPO ROOT (pyproject.toml there wins), so testpaths = .
# would resolve to the repo root and collect the whole tree.  Always invoke
# with an explicit positional path from the repo root:
#
#   PYTHONPATH=<repo-root> python -m pytest \
#       -c plugins/quality-gate/tests/pytest.ini \
#       plugins/quality-gate/tests/ -q
#
# The positional path keeps collection inside this directory regardless of rootdir.
testpaths = plugins/quality-gate/tests
# importlib mode: each test module imported under its own name, no implicit
# package rooted at the hyphenated parent dir (which is an invalid identifier).
addopts = --import-mode=importlib -ra
python_files = test_*.py
python_classes = Test*
python_functions = test_*
