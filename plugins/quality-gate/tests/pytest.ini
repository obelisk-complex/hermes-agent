[pytest]
# rootdir/testpaths pinned at this tests dir so collection never wanders up
# into the hyphenated plugin dir and imports it as bare __init__.
testpaths = .
# importlib mode: each test module imported under its own name, no implicit
# package rooted at the hyphenated parent dir (which is an invalid identifier).
addopts = --import-mode=importlib -ra
python_files = test_*.py
python_classes = Test*
python_functions = test_*
